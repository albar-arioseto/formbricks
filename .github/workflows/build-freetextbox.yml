name: Build Custom Formbricks Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck types package
        run: npx tsc --noEmit -p packages/types/tsconfig.json
      - name: Typecheck surveys package
        run: npx tsc --noEmit -p packages/surveys/tsconfig.json
      - name: Lint changed files
        run: npx eslint packages/types/ packages/surveys/ apps/web/modules/survey/ apps/web/app/\(app\)/workspaces/\[workspaceId\]/surveys/\[surveyId\]/\(analysis\)/summary/lib/

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=freetextbox
            type=sha,prefix=
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max_old_space_size=4096
          secrets: |
            database_url=postgresql://postgres:postgres@localhost:5432/formbricks
            encryption_key=dummy-encryption-key-for-build
            redis_url=redis://localhost:6379
            hub_api_url=http://localhost:8080
            hub_api_key=dummy-hub-api-key
            cubejs_api_url=http://localhost:4000
            cubejs_api_secret=dummy-cubejs-api-secret
